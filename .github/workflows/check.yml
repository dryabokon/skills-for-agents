name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python tools/check_repo.py
      - name: Tutorials run end to end
        run: |
          python tutorials/slides/01_build_a_deck.py
          python tutorials/diagrams/02_svg_and_check.py
          python tutorials/diagrams/01_mermaid_flow.py
