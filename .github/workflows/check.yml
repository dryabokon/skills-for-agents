name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python .github/check.py
      - name: Skill tests (cases needing gcloud or private tokens are skipped here)
        env:
          GH_TOKEN: ${{ github.token }}  # read-only, this repository; public data elsewhere
        run: python tests/run.py
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: runs/
